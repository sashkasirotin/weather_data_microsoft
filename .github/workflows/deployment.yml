name: Deployment

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_NAME: weather-app  # Docker image name
  ACR_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io  # ACR server URL
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}  # Azure resource group name
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}  # AKS cluster name

permissions:
  contents: read    # Required for repository checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Uses the latest Ubuntu runner

    steps:
      # Step 1: Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 for Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven  # Caches Maven dependencies

      # Step 3: Build the Java project with Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Step 4: Log in to Azure using Service Principal credentials
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      # Step 5: Log in to ACR
      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # Step 6: Build and Push Docker Image to ACR
      - name: Build and Push Docker Image
        run: |
          docker build -t $ACR_SERVER/$IMAGE_NAME:${{ github.sha }} .
          docker push $ACR_SERVER/$IMAGE_NAME:${{ github.sha }}

      # Step 7: Get AKS Credentials
      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $CLUSTER_NAME

      # Step 8: Deploy to AKS with Helm
      - name: Deploy to AKS with Helm
        run: |
          helm upgrade --install weather-app helm/weather-app \
            --set image.repository=$ACR_SERVER/$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always
