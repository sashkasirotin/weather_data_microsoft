name: Deployment

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_NAME: weather-app
  ACR_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Log in to Azure using Service Principal
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      # Log in to ACR
      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # Build and Push Docker Image to ACR
      - name: Build and Push Docker Image
        run: |
          docker build -t $ACR_SERVER/$IMAGE_NAME:${{ github.sha }} .
          docker push $ACR_SERVER/$IMAGE_NAME:${{ github.sha }}

      # Get AKS Credentials
      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $CLUSTER_NAME

      # Deploy to AKS with Helm
      - name: Deploy to AKS with Helm
        run: |
          helm upgrade --install weather-app helm/weather-app \
            --set image.repository=$ACR_SERVER/$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always
