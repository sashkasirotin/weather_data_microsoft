# This workflow automates building a Java project with Maven,
# pushing the Docker image to Azure Container Registry (ACR), 
# and deploying it to Azure Kubernetes Service (AKS) using Helm.

name: Deployment

# Trigger this workflow on push to the master branch or pull requests targeting master
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_NAME: weather-app  # Name of the Docker image
  ACR_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io  # ACR server URL
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}  # Azure resource group name
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}  # AKS cluster name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Specifies the latest Ubuntu runner
    
    steps:
      # Step 1: Checkout Code from the Repository
      - name: Checkout Repository
        uses: actions/checkout@v4  # This step fetches the latest code from the repo

      # Step 2: Set up JDK 17 to build the Java project
      - name: Set up JDK 17
        uses: actions/setup-java@v4  # Action to configure Java
        with:
          java-version: '17'  # Uses Java 17
          distribution: 'temurin'  # Temurin JDK distribution
          cache: maven  # Cache Maven dependencies for faster builds

      # Step 3: Build the Java project using Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml  # Packages the project into a JAR file

      # Step 4: Log in to Azure using GitHub Secrets
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}  # Service Principal Client ID
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}  # Azure Tenant ID
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  # Azure Subscription ID

      # Step 5: Log in to Azure Container Registry (ACR)
      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # Step 6: Build and Push Docker Image to ACR
      - name: Build and Push Docker Image
        run: |
          docker build -t $ACR_SERVER/$IMAGE_NAME:${{ github.sha }} .  # Build image with commit SHA tag
          docker push $ACR_SERVER/$IMAGE_NAME:${{ github.sha }}  # Push image to ACR

      # Step 7: Get AKS Credentials to interact with the AKS cluster
      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $CLUSTER_NAME

      # Step 8: Deploy to AKS using Helm
      - name: Deploy to AKS with Helm
        run: |
          helm upgrade --install weather-app helm/weather-app \
            --set image.repository=$ACR_SERVER/$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always
