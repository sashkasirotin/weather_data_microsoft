# This workflow automates the process of building a Java project with Maven,
# pushing the Docker image to Azure Container Registry (ACR), and deploying
# it to Azure Kubernetes Service (AKS) using Helm.

name: deployment

# Trigger this workflow on push to the master branch or pull requests targeting master
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Specifies that the workflow will run on the latest Ubuntu runner

    steps:
      # Step 1: Checkout Code from the Repository
      - uses: actions/checkout@v4  # This step checks out your repository's code

      # Step 2: Set up JDK 17 to build the Java project
      - name: Set up JDK 17
        uses: actions/setup-java@v4  # Action to set up Java
        with:
          java-version: '17'  # Specifies the Java version (17 in this case)
          distribution: 'temurin'  # Specifies the JDK distribution (Temurin is a popular open-source distribution)
          cache: maven  # Caches Maven dependencies to speed up builds

      # Step 3: Build the Java project using Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml  # Runs Maven to package the project into a JAR file

      # Step 4: Log in to Azure using a service principal (secrets must be set in GitHub)
      - name: Log in to Azure
        uses: azure/login@v1  # Azure login action
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}  # Service Principal Client ID (stored in GitHub secrets)
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}  # Azure Tenant ID (stored in GitHub secrets)
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  # Azure Subscription ID (stored in GitHub secrets)

      # Step 5: Log in to Azure Container Registry (ACR)
      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}  # Logs into ACR using the provided registry name (stored in GitHub secrets)

      # Step 6: Build the Docker image and push it to Azure Container Registry (ACR)
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }} .  # Builds Docker image with SHA tag
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }}  # Pushes Docker image to ACR

      # Step 7: Get AKS credentials to interact with the AKS cluster
      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.CLUSTER_NAME }}  # Fetches AKS credentials

      # Step 8: Deploy to AKS using Helm (if deployment already exists, this will upgrade it)
      - name: Deploy to AKS with Helm
        run: |
          helm upgrade --install weather-app helm/weather-app \  # Installs or upgrades the Helm release
            --set image.repository=${{ secrets.ACR_NAME }}.azurecr.io/weather-app \  # Specifies the Docker image repository
            --set image.tag=${{ github.sha }} \  # Uses the commit SHA as the image tag
            --set image.pullPolicy=Always  # Always pull the latest image during deployment
