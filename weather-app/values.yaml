replicaCount: 1

serviceAccount:
  create: true
  name: weather-app-sa  

image:
  repository: weatheralexacr.azurecr.io/weather-app
  tag: latest
  pullPolicy: Always
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations: {}
  hosts:
    - host: myapp.example.com
      paths:
        - path: /weather/fetch
          pathType: Prefix

resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "250m"
    memory: "128Mi"

