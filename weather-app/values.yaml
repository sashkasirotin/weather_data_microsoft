serviceAccount:
  create: true
  name: weather-app-sa  

image:
  repository: weatheralexacr.azurecr.io/weather-app
  tag: latest
  pullPolicy: Always
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
service:
  enabled: true
  name: weather-app
  namespace: default
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 31744
  selector:
    app.kubernetes.io/instance: weather-app
    app.kubernetes.io/name: weather-app

ingress:
  enabled: true
  name: weather-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: myapp.example.com
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: weather-app
              port:
                number: 80

resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "250m"
    memory: "128Mi"

